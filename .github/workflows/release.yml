name: Release
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SWAN_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/swan-release.jks"
      - name: Build signed minified release
        env:
          SWAN_KEYSTORE_PATH: ${{ runner.temp }}/swan-release.jks
          SWAN_KEYSTORE_PASSWORD: ${{ secrets.SWAN_KEYSTORE_PASSWORD }}
          SWAN_KEY_ALIAS: ${{ secrets.SWAN_KEY_ALIAS }}
          SWAN_KEY_PASSWORD: ${{ secrets.SWAN_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease
      - name: Create checksum
        run: sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
